apiVersion: apps/v1
kind: Deployment
metadata:
  name: messease-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: messease-backend
  template:
    metadata:
      labels:
        app: messease-backend
    spec:
      containers:
      - name: backend
        image: yourusername/messease-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: messease-backend-service
spec:
  selector:
    app: messease-backend
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer